<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
</head>
<body>
    <div class="container">
        <div class="container2">
        <form id="formularioderegistro" action="https://formsubmit.co/joao.santos1430@etec.sp.gov.br" method="POST">
            <h3>Crie sua Conta</h3>
                <input type="text" id="txname" name="Nome" placeholder="Digite o seu nome:" required />
                <input type="text" id="txlastname" name="Sobrenome" placeholder="Digite o seu sobrenome:">
                <input type="password" id="pass1" name="Senha" placeholder="Digite sua Senha:" required>
                <input type="password" id="pass2" name="SenhaC" placeholder="Confirme sua Senha:" required>
                
                <input type="email" name="Email" placeholder="Digite o seu e-mail:" required />
                <textarea name="info" placeholder="(Opcional) O que trouxe você aqui?" ></textarea>
                <div class="buttons">
            <button id="botaocriarconta" type="submit">Criar conta</button>
            <button id="botaologin" onclick="location.href='./index.html'">Login</button>
        </div>
        </form>
    </div>
    </div>
    <style>

* {
    font-family: 'Century Gothic';
    
}
 
body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url("./bkgscene.jpg");
    background-repeat: no-repeat;
    background-size: 100vw 100vh;

}
h3{
    color: aliceblue;
    font-size: 40px;
    margin-bottom: 15%;
}
form {
width: 350px;
height: 550px;
margin-top: 50px;
display: flex;
flex-direction: column;
align-items: center; 
justify-content: center;
margin-left: 33%;

border-radius: 6px;



 
}



input {
    display: flex;
    color: #808080;
    border: 1px solid #dddddd;
    border-radius: 7px;
    height: 50px;
    width: 300px;
    margin-bottom: 20px;
    padding: 6px;
}

input[type=textarea]{
 height: 80px;
}

.buttons {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

button {
    margin: 10px;
    border-radius: 10px;
    border: none;
    padding: 15px;
    padding-left: -14px;
    font-size: large;
    cursor: pointer;
    color: aliceblue;
    

}



textarea {
    height: 100px;
    width: 300px;
    margin-bottom: 20px;
    padding: 5px;
    border-radius: 10px;
    padding-top: 20px;
}

#botaologin {
    background: limegreen;
    transition-duration: 1s;
}
#botaologin:hover {
    box-shadow: 0 0 10px lime, 0 0 40px lime, 0 0 80px lime;
    transition-duration: 1s;
}

#botaocriarconta {
    background: red;
    transition-duration: 1s;
}

#botaocriarconta:hover {
    box-shadow: 0 0 10px crimson, 0 0 40px crimson, 0 0 80px crimson;
    transition-duration: 1s;
}


    </style>
    <script>
        const password1 = document.getElementById('pass1')
        const password2 = document.getElementById('pass2')


        function validate(item){
            item.setCustomValidity('')
            item.checkValidity()

            if (item == password2){
                if (item.value === pwd.value) item.setCustomValidity('')
                else item.setCustomValidity('As senhas não coincidem.')
            }
        }

        password1.addEventListener('input', function(){validate(password1)})
        password2.addEventListener('input', function(){validate(password2)})
    </script>
</body>
</html>
