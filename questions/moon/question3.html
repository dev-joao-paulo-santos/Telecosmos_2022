<body>
    
    <div class="container">
        <div id="cronometer"></div>
        <div class="row">

            <div class="questao">
                <form method="post" id="resposta">
                    <div class="enunciado">Sobre a lua, é correto afirmar:</div>
                    <p>
                        <input type="radio" name="answer" class="alternative" id="a" value="a" data-resposta="true">
                        <label for="a">A) O tamanho da Lua é de cerca de 1/3 em relação à Terra, com 3474,2 km de diâmetro</label>
                    </p>
                    <p>
                        <input type="radio" name="answer" class="alternative" id="b" value="b">
                        <label for="b">B) O tamanho da Lua é de cerca de 2/3 em relação à Terra, com 4250 km de diâmetro</label>
                    </p>
                    <p>
                        <input type="radio" name="answer" class="alternative" id="c" value="c" data-resposta="true">
                        <label for="c">C) A lua possui 5 fases: Minguante, Crescente, Cheia, Nova e Azul.</label>
                    </p>
                    <p>
                        <input type="radio" name="answer" class="alternative" id="d" value="d">
                        <label for="d">D) A lua é um portal para a galáxia Andrômeda</label>
                    </p>
                    <p>
                        <input type="radio" name="answer" class="alternative" id="e" value="e">
                        <label for="e">E) O efeito dos raios solares faz com que a lua assuma a função de uma lente gigantesca.</label>
                    </p>
                    <input type="submit" value="Respondi!" name="validar" id="validar">
                    <input type="button" onclick="location.href='../index.html'" value="Voltar" name="proximo">

                   
                  
                </form>

            </div>
