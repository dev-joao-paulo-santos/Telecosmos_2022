<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <script src="./jquery.js"></script>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <script src="./main.js"></script>
</head>

<body>
    <div class="container">
        <div id="cronometer"></div>
        <div class="row">
            <div class="questao">
                <form method="post" id="resposta">
                    <div class="enunciado">Por que Urano gira "deitado"?</div>
                    <p>
                        <input type="radio" name="answer" id="a" value="a">
                        <label for="a">A) Porque suas luas ficam em apenas um lado do planeta, forçando seu campo gravitacional.</label>
                    </p>
                    <p>
                        <input type="radio" name="answer" id="b" value="b">
                        <label for="b">B) Por causa da grande quantidade de gelo concentrada em um lado do planeta gasoso.</label>
                    </p>
                    <p>
                        <input type="radio" name="answer" id="c" value="c">
                        <label for="c">C) Por causa da radiação solar, que força os gases a irem para um lado do planeta.</label>
                    </p>
                    <p>
                        <input type="radio" name="answer" id="d" value="d">
                        <label for="d">D) Por causa de sua trajetória em volta do Sol, que é muito longa.</label>
                    </p>
                    <p>
                        <input type="radio" name="answer" id="e" value="e" data-resposta="true">
                        <label for="e">E) Por causa de seu eixo de rotação, cujo ângulo de inclinação atinge quase 98°.</label>
                    </p>
                    <input type="submit" value="Respondi!" name="validar">
                    <input type="button" value="Próximo!" name="Próximo" onclick= "location.href = './question3.html'">
                   
                </form>
            </div>
        </div>
    </div>
</body>

</html>
